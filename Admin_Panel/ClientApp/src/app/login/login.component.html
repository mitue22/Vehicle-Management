<div class="modal-header">
  <h5 class="modal-title">Login</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" formControlName="password" required />
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Login</button>
  </form>
</div>
<div class="text-center mt-3">
  <p>Don't have an account? 
    <a href="javascript:void(0)" (click)="redirectToSignup()">Sign up</a>
  </p>
</div>

<!-- Social Login Options -->
<div class="text-center mt-3">
  <p class="mb-2">Or</p>
  <button class="btn btn-outline-dark w-100 mb-2" (click)="continueWithGoogle()">
    <i class="bi bi-google"></i> Continue with Google
  </button>
  <button class="btn w-100 mb-2" (click)="continueWithMicrosoft()">
    <i class="bi bi-microsoft"></i> Continue with Microsoft
  </button>
  <button class="btn btn-outline-dark w-100" (click)="continueWithApple()">
    <i class="bi bi-apple"></i> Continue with Apple
  </button>
</div>
